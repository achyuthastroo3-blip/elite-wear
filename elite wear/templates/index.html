<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Html Site</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
    @keyframes showCard{

    0%{
    opacity:0;
    transform:translate(-50%,-60%) scale(0.5);
    }

    100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    }

}
</style>
</head>
<body>
<div style="
    background-image: url('https://images.unsplash.com/photo-1674958058549-e6ef631869ba?q=80&w=1347&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
     text-align: center;
      height: 100vh; 
      ">
<h1 style="
    text-align: left;
    padding-left:190px;
    padding-top: 50px;
    font-size: 70px;
    font-family: 'Times New Roman', serif;
    color: white;
    ">ELITE <span style="color: chocolate;"/>WEAR</h1>
    <p style="
        font-family:'Times New Roman', serif;
        font-size:18px;
        letter-spacing:1px;
        position:absolute;
        left:290px;
        top:150px;
        padding: 80px;
        padding-left: 15px;
         color:beige;

        ">
BEST FASHION STORE
</p>
   <h1 style="
        font-family:'Times New Roman', serif;
        font-size:30px;
        font-weight:500;
        line-height:60px;
        color:beige;
        position:absolute;
        left:150px;
        top:180px;
        margin:0;
        padding: 100px;
         text-align: center;
        ">
        OFFERS POWERED <br>
        BY <span style="color:brown;">DESIGNERS</span>
        <br>
        AROUND THE WORLD
</h1> 

     <p 
    style="
    color: antiquewhite;
    position:absolute;
    left:250px;
    top:500px;
     padding-left: 90px;
    ">Don't have account?</p>
    <a href="/createaccount" style="
    color: antiquewhite;
    position:absolute;
    left:290px;
    top:550px;
    padding-left: 60px;
    text-decoration: underline;
    ">Create account <i class="bi bi-arrow-right"
    style="font-size: 12px;
    top: 1px;
    left: 2px;
    "></i> </a>


<div style="
        height:650px;
        width:480px;
        border-radius:20px;
        position:absolute;
        right:100px;
        top:50%;
        transform:translateY(-50%);
        background-size: cover;
        background-position: center;
        top: 55%;
        border-style: solid;
        border-color: whitesmoke;
        background-image: url('https://images.unsplash.com/photo-1777822982062-42e6244a133e?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
       
        "> 
        <div style="
        height:300px;
        width:350px;
        background-color:black;
        border-radius:30px;
        color: white;
        position:absolute;
        top:70%;
        left:50%;
        transform:translate(-50%,-50%);
        animation:showCard 4s ease;

        ">
        <form method="POST">
            <p style="padding-top: 30px;">email</p>
            <input type="text" name="email"/>
        <p>Password</p>
        <input type="password" name="password"/>
        <div  style="padding-top: 40px;">
            <button style="width: 90px;
            height: 30px;
            border-radius: 20px;
            font-weight: bold;
            ">Login</button>
        </div>
        </form>
        </div>
</div>
</div>
